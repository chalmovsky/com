<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% elsif site.description %}
  <meta name="description" content="{{ site.description }}">
  {% endif %}
  {% feed_meta %}
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/favicon-96x96.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <style>
    @font-face {
      font-family: 'Lora';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url('/assets/fonts/lora-normal-400.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Lora';
      font-style: italic;
      font-weight: 400 600;
      font-display: swap;
      src: url('/assets/fonts/lora-italic-400.woff2') format('woff2');
    }
    :root {
      --bg: #1c1a18;
      --text: #d8d4cc;
      --secondary: #807a70;
      --link: #b89d4a;
      --code-bg: #252320;
      --font: 'Lora', Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: clip; }
    body {
      font-family: var(--font);
      font-size: 1.125rem;
      line-height: 1.7;
      color: var(--text);
      background: var(--bg);
      padding: 2rem 1.5rem;
      max-width: 42rem;
      margin: 0 auto;
      transition: background 0.3s, color 0.3s;
    }
    main { margin-bottom: 3rem; }
    a { color: var(--link); transition: opacity 0.2s; }
    a:hover { opacity: 0.8; }
    h1, h2, h3 { line-height: 1.3; margin-bottom: 1rem; font-weight: 600; }
    h1 { font-size: 1.75rem; }
    p, ul, ol { margin-bottom: 1rem; }
    ul, ol { padding-left: 1.5rem; }
    li { margin-bottom: 0.5rem; }
    .posts { list-style: none; padding-left: 0; }
    .posts li { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; }
    .posts li small { white-space: nowrap; flex-shrink: 0; }
    time, small { color: var(--secondary); font-size: 0.9rem; }
    article time { display: block; margin-bottom: 1.5rem; }
    code { background: var(--code-bg); padding: 0.15rem 0.4rem; border-radius: 3px; font-size: 0.9em; }
    pre { background: var(--code-bg); padding: 1rem; overflow-x: auto; margin-bottom: 1rem; border-radius: 4px; }
    pre code { background: none; padding: 0; }
    iframe, video, img { max-width: 100%; height: auto; }
    header { margin-bottom: 1rem; }
    header a { color: var(--text); text-decoration: none; font-size: 1.25rem; font-weight: 600; }
    hr { border: none; border-top: 1px solid var(--secondary); margin: 2rem 0; opacity: 0.4; }

  </style>
  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.chalmovsky.com/js/pa-Ul24e2UDUKHhYK2Opbtpx.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
</head>
<body>
  <main>
    {{ content }}
  </main>

</body>
</html>
