---
layout: default
---

<div class="site-header">
  <h1>{{ site.title }}</h1>
  <picture>
    <source srcset="{{ '/assets/chalmovsky-200.webp' | relative_url }}" type="image/webp">
    <img src="{{ '/assets/chalmovsky-200.png' | relative_url }}" alt="{{ site.title }}" class="profile-image" width="200" height="200">
  </picture>
</div>

<style>
  .site-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .profile-image {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border-radius: 50%;
  }
  .site-header h1 {
    margin-top: 1rem;
    color: var(--text);
  }
</style>

{{ content }}

<ul class="posts">
  {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <small>{{ post.date | date: "%Y-%m-%d" }}</small>
    </li>
  {% endfor %}
</ul>

<div class="contact-picker">
  <button class="contact-toggle" aria-label="Contact" aria-haspopup="true" aria-expanded="false"></button>
  <div class="contact-menu" role="menu">
    <div class="contact-option">
      <span class="contact-label">Want to message me?</span>
      <span class="contact-email"></span>
    </div>
  </div>
</div>

<style>
  .contact-picker {
    position: fixed;
    bottom: 1.5rem;
    left: 1.5rem;
    z-index: 1000;
  }
  .contact-toggle {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    border: 2px solid var(--secondary);
    background: var(--bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s;
  }
  .contact-toggle:hover { border-color: var(--link); }
  .contact-toggle:focus-visible {
    outline: 2px solid var(--link);
    outline-offset: 2px;
  }
  .contact-toggle::after {
    content: '';
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 50%;
    background: var(--link);
  }
  .contact-menu {
    position: absolute;
    bottom: 3rem;
    left: 0;
    background: var(--code-bg);
    border-radius: 8px;
    padding: 0.5rem 0;
    min-width: 160px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .contact-picker.open .contact-menu {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }
  .contact-option {
    padding: 0.5rem 1rem;
    user-select: text;
  }
  .contact-label {
    display: block;
    color: var(--secondary);
    font-size: 0.8rem;
    font-style: italic;
    margin-bottom: 0.15rem;
  }
  .contact-email {
    color: var(--link);
    font-size: 0.9rem;
    font-family: var(--font);
  }
</style>

<script>
  const picker = document.querySelector('.contact-picker');
  const toggle = document.querySelector('.contact-toggle');

  toggle.addEventListener('click', () => {
    const open = picker.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
  });

  document.addEventListener('click', e => {
    if (!picker.contains(e.target) && picker.classList.contains('open')) {
      picker.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && picker.classList.contains('open')) {
      picker.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    }
  });

  // Assemble email at runtime to deter scrapers
  const el = document.querySelector('.contact-email');
  const u = 'yes.upgrade887', d = 'passinbox.com';
  el.textContent = u + '@' + d;
</script>
