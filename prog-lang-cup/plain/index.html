.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px 10px;align-items:start}

.t caption{text-align:left;font-weight:bold;font-size:14px;padding:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t caption .muted{font-weight:normal;font-size:12px}
.t th,.t td{border:1px solid var(--line);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t th{background:var(--soft);font-weight:normal;font-size:11.5px;color:var(--muted);text-align:left}
.t .r{text-align:right;font-variant-numeric:tabular-nums}
.t col.c1{width:18px}.t col.c3{width:36px}.t col.c4{width:30px}.t col.c1w{width:24px}.t col.cw{width:48px}
.wide{max-width:520px}
.t tr.q td{font-weight:bold}
.t tr.out td{color:var(--muted);text-decoration:line-through}
.t tbody.fx td{font-size:12px;border-top-color:var(--line)}
.t tbody.fx tr:first-child td{border-top:2px solid var(--fg)}
.t td.fxl a,.t td.fxl span{display:block;overflow:hidden;text-overflow:ellipsis}
.t .w{font-weight:bold}
.t .tbd{color:var(--muted);font-style:italic}
.t tbody.m+tbody.m tr:first-child td{border-top:2px solid var(--fg)}
.t tbody.m.ready{cursor:pointer}
.t tbody.m.ready td{background:var(--hot)}
.t tbody.m.dim td{color:var(--muted)}
.t tbody.m td.lbl{font-size:11px;color:var(--muted);background:var(--soft)}
.t tbody.m.ready td.lbl{background:var(--hot)}

/* setup */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 12px;margin:.6em 0 1em;padding:.6em .7em;border:1px solid var(--line)}

// Generic via element size: items are copied in and out as raw bytes.
typedef struct {
    char *data;
    size_t elem_size, len, cap;
} Stack;

Stack stack_new(size_t elem_size) { return (Stack){.elem_size = elem_size}; }

bool stack_is_empty(const Stack *s) { return s->len == 0; }

void stack_push(Stack *s, const void *item) {
    if (s->len == s->cap) {
        s->cap = s->cap ? s->cap * 2 : 4;
        s->data = realloc(s->data, s->cap * s->elem_size);
    }
    memcpy(s->data + s->len++ * s->elem_size, item, s->elem_size);
}

bool stack_peek(const Stack *s, void *out) {
    if (stack_is_empty(s)) return false;
    memcpy(out, s->data + (s->len - 1) * s->elem_size, s->elem_size);
    return true;
}

bool stack_pop(Stack *s, void *out) {
    if (!stack_peek(s, out)) return false;
    s->len--;
    return true;
}

int main(void) {
    Stack nums = stack_new(sizeof(int));
    for (int n = 1; n <= 3; n++) stack_push(&nums, &n);
    int top, next;
    stack_pop(&nums, &top);
    stack_peek(&nums, &next);
    printf("%d %d\n", top, next); // 3 2

    Stack words = stack_new(sizeof(const char *));
    const char *hello = "hello", *world = "world", *word;
    stack_push(&words, &hello);
    stack_push(&words, &world);
    stack_pop(&words, &word);
    printf("%s\n", word); // world

    Stack empty = stack_new(sizeof(int));
    if (!stack_pop(&empty, &top)) puts("stack is empty");

    free(words.data);
    return 0;
}

  Stack(items: List(a))

  Stack([])

// Zig's std has no regex engine, so match the YYYY-MM-DD shape by hand.
fn isDate(s: []const u8) bool {
    for (s, 0..) |c, i| {
        const ok = if (i == 4 or i == 7) c == '-' else std.ascii.isDigit(c);
        if (!ok) return false;
    }
    return true;
}

    const stdout = std.io.getStdOut().writer();
    const text = "Released 2024-03-15, patched 2024-04-02, retired 2025-01-31.";
    var i: usize = 0;
    while (i + 10 <= text.len) : (i += 1) {
        const s = text[i .. i + 10];
        if (!isDate(s)) continue;
        try stdout.print("year {s}, month {s}, day {s}\n", .{ s[0..4], s[5..7], s[8..10] });
        i += 9;
    }
}

fn escape_html(s: &str) -> String {
    let mut out = String::with_capacity(s.len());
    for c in s.chars() {
        match c {
            '&' => out.push_str("&amp;"),
            '<' => out.push_str("&lt;"),
            '>' => out.push_str("&gt;"),
            '"' => out.push_str("&quot;"),
            '\'' => out.push_str("&#39;"),
            _ => out.push(c),
        }
    }
    out
}

void escape_html(const char *s, FILE *out) {
    for (; *s; s++) {
        switch (*s) {

NSString *EscapeHTML(NSString *s) {

  use age <- decode.field("age", decode.int)
  use langs <- decode.field("langs", decode.list(decode.string))
  decode.success(Person(name:, age:, langs:))

  json.object([
    #("name", json.string(person.name)),
    #("age", json.int(person.age)),
    #("langs", json.array(person.langs, json.string)),
  ])
}

  let text = "{\"name\": \"Ada\", \"age\": 36, \"langs\": [\"Python\", \"Rust\"]}"

  io.println(person.name)

  Person(..person, age: person.age + 1, langs: list.append(person.langs, ["Go"]))
  |> person_to_json
  |> json.to_string
  |> io.println

  case float.parse(text), int.parse(text) {

    _, _ -> 0.0
  }

        _ -> sum
      }
    })

  let decimals = string.pad_start(int.to_string(cents % 100), 2, "0")

fn printDate(writer: anytype, day: epoch.EpochDay) !void {

    var days: u64 = 0;
    var year: epoch.Year = 1970;
    while (year < 2000) : (year += 1) days += epoch.getDaysInYear(year);
    const names = [_][]const u8{ "Thursday", "Friday", "Saturday", "Sunday", "Monday", "Tuesday", "Wednesday" };

            } else {

#include <pthread.h>
#include <stdio.h>

#define EMPTY 0
#define DONE -1

static int slot = EMPTY;
static pthread_mutex_t lock = PTHREAD_MUTEX_INITIALIZER;
static pthread_cond_t changed = PTHREAD_COND_INITIALIZER;

static void put(int value) {
    pthread_mutex_lock(&lock);
    while (slot != EMPTY)
        pthread_cond_wait(&changed, &lock);
    slot = value;
    pthread_cond_signal(&changed);
    pthread_mutex_unlock(&lock);
}

static int take(void) {
    pthread_mutex_lock(&lock);
    while (slot == EMPTY)
        pthread_cond_wait(&changed, &lock);
    int value = slot;
    slot = EMPTY;
    pthread_cond_signal(&changed);
    pthread_mutex_unlock(&lock);
    return value;
}

static void *producer(void *arg) {
    (void)arg;
    for (int n = 1; n <= 5; n++)
        put(n);
    put(DONE);
    return NULL;
}

int main(void) {
    pthread_t thread;
    pthread_create(&thread, NULL, producer, NULL);
    for (int n; (n = take()) != DONE;)
        printf("got %d\n", n);
    pthread_join(thread, NULL);
    return 0;
}

template <typename T>
class Channel {
    std::queue<T> items;
    bool closed = false;
    std::mutex m;
    std::condition_variable cv;

public:
    void send(T value) {
        { std::lock_guard lock(m); items.push(std::move(value)); }
        cv.notify_one();
    }
    void close() {
        { std::lock_guard lock(m); closed = true; }
        cv.notify_all();
    }
    std::optional<T> receive() {
        std::unique_lock lock(m);
        cv.wait(lock, [&] { return !items.empty() || closed; });
        if (items.empty()) return std::nullopt; // closed and drained
        T value = std::move(items.front());
        items.pop();
        return value;
    }
};

        for (int n = 1; n <= 5; ++n) channel.send(n);

const Mailbox = struct {
    mutex: std.Thread.Mutex = .{},
    cond: std.Thread.Condition = .{},
    item: ?usize = null,
    closed: bool = false,

    fn put(self: *Mailbox, n: usize) void {
        self.mutex.lock();
        defer self.mutex.unlock();
        while (self.item != null) self.cond.wait(&self.mutex);
        self.item = n;
        self.cond.signal();
    }

    fn close(self: *Mailbox) void {
        self.mutex.lock();
        defer self.mutex.unlock();
        self.closed = true;
        self.cond.signal();
    }

    fn take(self: *Mailbox) ?usize {
        self.mutex.lock();
        defer self.mutex.unlock();
        while (self.item == null and !self.closed) self.cond.wait(&self.mutex);
        const n = self.item orelse return null; // closed and empty
        self.item = null;
        self.cond.signal();
        return n;
    }
};

static void print_part(CURLU *url, CURLUPart part, const char *label) {
    char *value;
    if (curl_url_get(url, part, &value, 0) == CURLUE_OK) {
        printf("%s: %s\n", label, value);
        curl_free(value);
    }

    CURLU *url = curl_url();
    if (curl_url_set(url, CURLUPART_URL,
                     "https://example.com:8080/search?q=hello+world&page=2#top", 0) != CURLUE_OK) {
        fprintf(stderr, "invalid URL\n");
        return 1;
    }
    print_part(url, CURLUPART_SCHEME, "scheme");
    print_part(url, CURLUPART_HOST, "host");
    print_part(url, CURLUPART_PORT, "port");
    print_part(url, CURLUPART_PATH, "path");

    char *query;
    curl_url_get(url, CURLUPART_QUERY, &query, 0);
    for (char *pair = strtok(query, "&"); pair; pair = strtok(NULL, "&")) {
        for (char *p = pair; *p; p++)
            if (*p == '+') *p = ' ';
        char *value = strchr(pair, '=');
        *value++ = '\0';
        char *decoded = curl_easy_unescape(NULL, value, 0, NULL);
        printf("%s = %s\n", pair, decoded);
        curl_free(decoded);
    }
    curl_free(query);

    print_part(url, CURLUPART_FRAGMENT, "fragment");
    curl_url_cleanup(url);
    return 0;
}

        defer allocator.free(value);

    int server = socket(AF_INET, SOCK_STREAM, 0);

    struct sockaddr_in addr = {.sin_family = AF_INET, .sin_port = htons(8080)};

        char request[1024] = {0};

                         "Connection: close\r\n\r\n%s",

import com.sun.net.httpserver.HttpExchange;
import com.sun.net.httpserver.HttpServer;
import java.io.IOException;
import java.net.InetSocketAddress;
import java.nio.charset.StandardCharsets;

public class Main {
    public static void main(String[] args) throws IOException {
        var server = HttpServer.create(new InetSocketAddress(8080), 0);
        server.createContext("/", Main::handle);
        server.start();
        System.out.println("Listening on http://localhost:8080");
    }

    static void handle(HttpExchange exchange) throws IOException {
        boolean found = exchange.getRequestMethod().equals("GET")
                && exchange.getRequestURI().getPath().equals("/hello");
        byte[] body = (found ? "Hello, web!" : "Not found").getBytes(StandardCharsets.UTF_8);
        exchange.getResponseHeaders().set("Content-Type", "text/plain");
        exchange.sendResponseHeaders(found ? 200 : 404, body.length);
        try (var out = exchange.getResponseBody()) {
            out.write(body);
        }
    }
}

#include <iostream>
#include <memory>

using Db = std::unique_ptr<sqlite3, decltype(&sqlite3_close)>;
using Stmt = std::unique_ptr<sqlite3_stmt, decltype(&sqlite3_finalize)>;

Stmt prepare(sqlite3* db, const char* sql) {
    sqlite3_stmt* stmt = nullptr;
    sqlite3_prepare_v2(db, sql, -1, &stmt, nullptr);
    return {stmt, sqlite3_finalize};
}

int main() {
    sqlite3* raw = nullptr;
    sqlite3_open(":memory:", &raw);
    Db db{raw, sqlite3_close};
    sqlite3_exec(db.get(), "CREATE TABLE users (name TEXT, age INTEGER)", nullptr, nullptr, nullptr);

    struct User { const char* name; int age; };
    auto insert = prepare(db.get(), "INSERT INTO users (name, age) VALUES (?, ?)");
    for (auto [name, age] : {User{"Ada", 36}, {"Linus", 28}, {"Grace", 45}}) {
        sqlite3_bind_text(insert.get(), 1, name, -1, SQLITE_STATIC);
        sqlite3_bind_int(insert.get(), 2, age);
        sqlite3_step(insert.get());
        sqlite3_reset(insert.get());
    }

    sqlite3_bind_int(query.get(), 1, 30);

    for (; *s; s++) {
        switch (*s) {
        case '&':  fputs("&amp;", stdout);  break;
        case '<':  fputs("&lt;", stdout);   break;
        case '>':  fputs("&gt;", stdout);   break;
        case '"':  fputs("&quot;", stdout); break;
        case '\'': fputs("&#39;", stdout);  break;
        default:   putchar(*s);

}

struct Product {
    std::string name;
    double price;
};

std::string escape_html(std::string_view s) {
    std::string out;
    for (char c : s) {
        switch (c) {
            case '&': out += "&amp;"; break;
            case '<': out += "&lt;"; break;
            case '>': out += "&gt;"; break;
            case '"': out += "&quot;"; break;
            case '\'': out += "&#39;"; break;
            default: out += c;
        }
    }
    return out;
}

std::string render(const std::vector<Product>& products) {
    std::string html = "<ul>\n";
    for (const auto& [name, price] : products)
        html += std::format("  <li>{} — ${:.2f}</li>\n", escape_html(name), price);
    return html + "</ul>";
}

int main() {
    std::cout << render({{"Coffee", 3.50}, {"Tea", 2.25}, {"Cake <3>", 4.00}}) << '\n';

import java.util.stream.Collectors;

public class Main {
    record Product(String name, double price) {}

    static String escapeHtml(String s) {
        return s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
                .replace("\"", "&quot;").replace("'", "&#39;");
    }

    static String render(List<Product> products) {

<script>
(function () {

}

}

  var cls = m.done ? (m.winner === who ? ' class="w"' : '') : '';

}
function roundTable(title, ids) {

  ids.forEach(function (id) {
    var m = C.S.matches[id], active = C.isActive(m), p = C.participants(m), s = C.score(m, p[0], p[1]);
    var ready = C.isReady(m), cls = 'm' + (ready ? ' ready' : '') + (!active ? ' dim' : '');
    var open = active && p[0] && p[1] ? ' data-open="' + id + '"' : '';
    var lbl = E(m.short) + (m.bo > 3 ? ' · first to 3' : '') + (ready ? ' · ready' : '');
    h += '<tbody class="' + cls + '"' + open + '><tr><td class="lbl" colspan="2">' + lbl + '</td></tr>' +
      '<tr>' + sideCell(m, m.a, p[0], s[0]) + '</tr><tr>' + sideCell(m, m.b, p[1], s[1]) + '</tr></tbody>';
  });
  return h + '</table>';
}
function home() {
  view = 'home';
  if (!C.S) { setChosen(C.lastPicked() || C.POPULAR); return setup(); }
  var S = C.S, pr = C.progress(), ch = C.podium(), n = C.nextMatch(), h = '<h1>Plain Programming Language Cup</h1>';
  if (!C.STORAGE_OK) h += '<p class="note">This browser is blocking storage, so progress will not be saved.</p>';
  if (msg) h += '<p class="note">' + E(msg) + '</p>';
  h += '<p>' + pr.phase + ', ' + pr.done + ' of ' + pr.total + ' matches played · ' + S.langs.length + ' languages.</p>';
  if (ch) h += '<p><b>Champion: ' + nm(ch.first) + '.</b> Second: ' + nm(ch.second) + (ch.third ? '. Third: ' + nm(ch.third) : '') + '.</p>';
  else if (n) { var p = C.participants(n); h += '<p><b>' + link('data-open="' + n.id + '"', (n.picks.length ? 'Continue' : 'Play next') + ': ' + nm(p[0]) + ' vs ' + nm(p[1])) + '</b> <span class="muted small">(' + E(n.label) + ')</span></p>'; }
  h += '<details class="small"><summary>How it works</summary><p>' + E(C.describePlan(S.langs.length)) +
    ' Each match is first to 2 duels; the grand final is first to 3. Group ties are broken by duel difference, then duels won, then head-to-head. ' +
    'In the playoffs a language drops to the lower bracket after its first loss and is out after its second; the grand final is a single match. ' +
    'Bold rows have qualified; struck-through rows are out.</p></details>';

  h += '<h2>Groups</h2><div class="grid g4">' + S.gorder.map(groupTable).join('') + '</div>';
  h += '<h2>Upper bracket</h2><div class="grid">' + S.ub.map(function (ids, i) { return roundTable(S.ubNames[i], ids); }).join('') + '</div>';
  h += '<h2>Lower bracket</h2><div class="grid">' + S.lb.map(function (ids, i) { return roundTable(S.lbNames[i], ids); }).join('') + '</div>';
  h += '<h2>Grand final</h2><div class="grid">' + roundTable('Grand Final', ['GF1']) + '</div>';

  var st = C.stats();
  h += '<h2>Your picks</h2>';
  if (!st.total) h += '<p class="muted">Nothing yet.</p>';
  else {
    var rows = st.rows, per = Math.ceil(rows.length / Math.ceil(rows.length / 8)), chunks = [];
    for (var i = 0; i < rows.length; i += per) chunks.push(rows.slice(i, i + per));
    h += '<div class="grid">' + chunks.map(function (c, ci) {
      return '<table class="t"><colgroup><col class="c1w"><col><col class="cw"><col class="c4"></colgroup>' +
        '<thead><tr><th>#</th><th>Language</th><th class="r">Won</th><th class="r">%</th></tr></thead><tbody>' +
        c.map(function (r, i) {
          return '<tr' + (r.status === 'out' ? ' class="out"' : r.status === 'champ' ? ' class="q"' : '') + '><td class="r">' + (ci * per + i + 1) + '</td><td>' + nm(r.id) + '</td><td class="r">' +
            r.w + '/' + r.p + '</td><td class="r">' + (r.pct == null ? '' : r.pct) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }).join('') + '</div>';
    h += '<h3>By category</h3><div class="wide"><table class="t"><colgroup><col><col class="cw"><col></colgroup><thead><tr><th>Category</th><th class="r">Duels</th><th>Most wins</th></tr></thead><tbody>' +
      st.cats.map(function (c) {
        return '<tr><td>' + E(C.CATMAP[c.id].name) + '</td><td class="r">' + c.n + '</td><td>' + (c.top ? nm(c.top) + ' (' + c.topWins + ')' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  var last = C.HIST[C.HIST.length - 1];
  h += '<h2>Other</h2>';
  if (last) h += '<p>' + link('data-a="undo"', 'Undo the last result (' + E(last.label) + ')') + '</p>';
  h += '<p>' + link('data-a="setup"', 'Start a new tournament') + ' <span class="muted small">(choose languages; this one is kept until you start)</span></p>';
  h += '<p class="small muted">Snippets you have seen: ' + C.seenTotal() + ' of ' + TOTAL + '. ' + link('data-a="forget"', 'Forget them') + '</p>';
  h += ABOUT;
  app.innerHTML = h;
}

/* ---------- a match ---------- */
function match(id) {
  var r = C.prepare(id);
  if (!r.ok) { msg = r.reason; current = null; return home(); }
  view = 'match'; current = id;
  var m = r.m, a = r.a, b = r.b, s = C.score(m, a, b), n = m.picks.length;
  var h = '<p>' + link('data-a="home"', '← Back to the tournament') + '</p>' + (msg ? '<p class="note">' + E(msg) + '</p>' : '') +
    '<h1>' + nm(a) + ' ' + s[0] + '–' + s[1] + ' ' + nm(b) + '</h1><p class="muted">' + E(m.label) + ' · first to ' + C.need(m) + '.</p>' +
    '<p class="small"><label class="autonext"><input type="checkbox" id="autonext" data-autonext' + (autoNext ? ' checked' : '') + '> Automatically go to the next match</label></p>';
  if (m.done || C.finished(m)) {
    h += '<ol class="duels">' + m.picks.map(function (p, i) {
      var c = C.CHMAP[m.games[i]];
      return '<li><span class="cat">' + E(C.CATMAP[c.cat].name) + '</span>' + E(c.title) + ': ' + nm(p) + '</li>';
    }).join('') + '</ol>';
    if (!m.done) h += '<p><b>' + nm(s[0] > s[1] ? a : b) + ' won.</b></p><p><button data-a="finish">Confirm the result</button> &nbsp;' + link('data-a="undopick"', 'Undo the last pick') + '</p>';
  } else {
    var c = C.CHMAP[m.games[n]], order = m.flips[n] ? [b, a] : [a, b];
    h += '<h2>Duel ' + (n + 1) + ': ' + E(c.title) + '</h2><p><span class="cat">' + E(C.CATMAP[c.cat].name) + '</span>' + E(c.desc) + '</p>';
    h += '<div class="duel">';
    order.forEach(function (l) {
      h += '<div><h3>' + nm(l) + '</h3><pre>' + C.hl(C.snippet(c.id, l), l) + '</pre><button class="pickbtn" data-pick="' + l + '">' + nm(l) + ' wins this duel</button></div>';
    });
    h += '</div>';
    if (n) h += '<p>' + link('data-a="undopick"', 'Undo the last pick') + '</p>';
  }
  app.innerHTML = h;
}

/* Browser history: opening a match or the language picker is a step, so Back returns to the tournament. */
function enter(st) { var h = history.state; if (!h || h.v !== st.v || h.id !== st.id) history.pushState(st, ''); }
function leave() { if (history.state && history.state.v) { history.back(); return true; } return false; }
function show(st) {
  if (st && st.v === 'match' && C.S && C.S.matches[st.id]) return match(st.id);
  if (st && st.v === 'setup') { setChosen(C.S ? C.S.langs : C.lastPicked() || C.POPULAR); return setup(); }
  current = null; home();
}
addEventListener('popstate', function (e) { show(e.state); scrollTo(0, 0); });

/* After a match is locked in: straight into the next one when the box is ticked, else back to the tournament. */
function afterMatch() {
  current = null;
  var next = autoNext && !C.champion() && C.nextMatch();
  if (next) { var st = { v: 'match', id: next.id }; if (history.state && history.state.v === 'match') history.replaceState(st, ''); else history.pushState(st, ''); return match(next.id); }
  if (!leave()) home();
}

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-autonext')) { autoNext = t.checked; C.store.set(AUTO_KEY, autoNext); return; }
  if (!t.hasAttribute || !t.hasAttribute('data-lang')) return;
  chosen[t.getAttribute('data-lang')] = t.checked;
  refreshSetupControls();
});
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-open],[data-pick],[data-a],[data-quick]');
  if (!t) return;
  e.preventDefault();
  var a = t.getAttribute('data-a');
  msg = '';
  if (t.hasAttribute('data-quick')) {
    var q = t.getAttribute('data-quick'), all = C.LANGS.map(function (l) { return l.id; });
    setChosen(q === 'all' ? all : q === 'none' ? [] : q === 'popular' ? C.POPULAR :
      C.shuffle(all).slice(0, q === 'r8' ? 8 : 16));
    return setup();
  }
  if (t.hasAttribute('data-open')) { enter({ v: 'match', id: t.getAttribute('data-open') }); match(t.getAttribute('data-open')); scrollTo(0, 0); return; }
  if (t.hasAttribute('data-pick')) {
    var m = C.S.matches[current];
    C.pick(m, t.getAttribute('data-pick'));
    if (!C.finished(m)) { match(current); scrollTo(0, 0); return; }
    msg = C.confirmMatch(m); afterMatch(); scrollTo(0, 0); return;
  }
  if (a === 'home') { current = null; if (!leave()) home(); }
  else if (a === 'setup') { enter({ v: 'setup' }); setChosen(C.S ? C.S.langs : C.lastPicked() || C.POPULAR); setup(); }
  else if (a === 'start') {
    if (C.S && C.progress().done > 0 && !C.champion() && t.textContent.indexOf('Really') !== 0) {
      t.textContent = 'Really start over? This ends the current tournament (' + C.progress().done + ' matches played)'; return;
    }
    if (C.start(chosenIds())) { if (!leave()) home(); }
  }
  else if (a === 'finish') { msg = C.confirmMatch(C.S.matches[current]); afterMatch(); }
  else if (a === 'undopick') { C.undoPick(C.S.matches[current]); match(current); }
  else if (a === 'undo') { var h = C.undoResult(); if (h) { C.undoPick(C.S.matches[h.id]); enter({ v: 'match', id: h.id }); match(h.id); } }
  else if (a === 'forget') {
    if (t.textContent !== 'Click again to forget') { t.textContent = 'Click again to forget'; return; }
    C.forgetSeen(); home();
  }
  scrollTo(0, 0);
});
show(history.state);
})();
</script>
</body>
</html>
